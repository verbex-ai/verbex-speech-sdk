[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "verbex-speech-sdk"
version = "0.1.0"
description = "Python SDK for the Verbex Speech API: speech-to-text and text-to-speech."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Verbex" }]
dependencies = ["httpx>=0.27,<1", "websockets>=13,<18"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.hatch.build.targets.wheel]
packages = ["src/verbex_speech"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
markers = ["live: calls a real Verbex Speech API; needs VERBEX_API_KEY and VERBEX_BASE_URL"]
